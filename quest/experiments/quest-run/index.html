<!doctype html>
<html lang="en">
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest Run</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: the Quest Run screen. Quest bar on top; the board (Dungeon or Plan) in the center;
   party chat on the right; the card hand along the bottom. Same single dark look as the hub mockup. */
:root{
  --night:#0b0e15; --stone:#141a26; --stone-2:#1b2333; --edge:#2b3548; --ink:#ece6d6; --muted:#9aa3b5;
  --gold:#e2b552; --gold-deep:#a97a22; --blue:#3d7bff; --blue-glow:#5ea0ff; --ok:#68c58f; --ask:#f0a24b; --warn:#e5674f; --fog:#06080d;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:14px/1.45 var(--body)}
.screen{min-height:100%;display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* quest bar: a game HUD (task-hud). One row from 1181 px; the objectives take a second row below that.
   Phone hooks: .hud-banner, .hud-badges, .qbar .goals, .hud-status, .hud-sys. */
.qbar{grid-column:1/-1;min-width:0;position:relative;z-index:5;display:flex;flex-wrap:nowrap;align-items:center;gap:10px 14px;padding:12px 16px 9px;
  background:linear-gradient(180deg,#1a2233,#10151f 70%,#0d1119);border-bottom:2px solid #3a3020;box-shadow:inset 0 -1px 0 rgba(226,181,82,.18),0 4px 14px rgba(0,0,0,.45)}
.qbar .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* the HUD's stone buttons: Back, and the small system buttons with their tooltips */
.qbar .back,.hud-btn,.qbar .dfb-btn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;place-items:center;color:#c9b88f;
  background:linear-gradient(180deg,#2a3346,#1a2132);border:1px solid #46526b;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 0 #090c12}
.qbar .back{flex:none;width:44px;height:46px;align-content:center;gap:2px;font:700 9.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
.hud-btn,.qbar .dfb-btn{width:30px;height:30px;padding:0;gap:0}
.hud-btn svg,.qbar .dfb-btn svg{width:16px;height:16px}
.qbar .dfb-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.qbar .back:hover,.hud-btn:hover,.qbar .dfb-btn:hover{color:var(--gold);border-color:var(--gold-deep);background:linear-gradient(180deg,#343c4f,#20283a);box-shadow:inset 0 1px 0 rgba(255,231,166,.15),0 2px 0 #090c12,0 0 10px rgba(226,181,82,.25)}
.qbar .back:active,.hud-btn:active,.qbar .dfb-btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.qbar .back:focus-visible,.hud-btn:focus-visible,.qbar .dfb-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hud-btn[hidden]{display:none}
.qbar .back[data-tip]::after,.hud-btn[data-tip]::after,.qbar .dfb-btn[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);right:0;z-index:40;pointer-events:none;opacity:0;transform:translateY(-3px);transition:opacity .12s,transform .12s;
  white-space:nowrap;font:700 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:#0d1119;border:1px solid var(--gold-deep);border-radius:6px;padding:6px 8px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.qbar .back[data-tip]::after{left:0;right:auto}
.qbar .back:hover::after,.qbar .back:focus-visible::after,.hud-btn:hover::after,.hud-btn:focus-visible::after,.qbar .dfb-btn:hover::after,.qbar .dfb-btn:focus-visible::after{opacity:1;transform:none}
.hud-sys{flex:none;display:grid;grid-template-rows:repeat(2,30px);grid-auto-flow:column;grid-auto-columns:30px;gap:5px}
/* the quest banner: a carved plate with gold trim and rivets, the QUEST ribbon on its top edge */
.qbar .qtitle{flex:0 1 auto;min-width:0;position:relative;padding:9px 14px 6px;border:1px solid #6d5320;border-radius:7px;
  background:radial-gradient(circle at 5px 5px,#e2b552 1.3px,transparent 2px),radial-gradient(circle at calc(100% - 5px) 5px,#e2b552 1.3px,transparent 2px),
    radial-gradient(circle at 5px calc(100% - 5px),#e2b552 1.3px,transparent 2px),radial-gradient(circle at calc(100% - 5px) calc(100% - 5px),#e2b552 1.3px,transparent 2px),
    linear-gradient(180deg,#2a3247,#1a2131 55%,#151b28);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 1px rgba(255,231,166,.12),0 2px 0 #07090e,0 0 0 1px rgba(226,181,82,.12)}
.qbar .qtitle .k{position:absolute;top:-8px;left:12px;padding:3px 12px 2px;font:700 10px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:#1b1406;
  background:linear-gradient(180deg,#f6d77f,var(--gold) 50%,#b88426);clip-path:polygon(0 0,100% 0,calc(100% - 5px) 50%,100% 100%,0 100%,5px 50%);filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.qbar .qtitle h1{font:italic 700 23px/1.05 var(--display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 14px rgba(226,181,82,.12)}
.demo-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:5px}
.demo-tag,.qbar .net-pill,.qbar .net-continue{display:inline-flex;align-items:center;gap:5px;font:700 10.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
  padding:3px 7px 3px 6px;border-radius:4px;border:1px solid;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 #07090e;margin:0}
.demo-tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:var(--ask);border-color:rgba(240,162,75,.55);background:linear-gradient(180deg,rgba(240,162,75,.16),rgba(240,162,75,.05))}
.demo-tag::before{content:"";display:inline-block;vertical-align:1px;margin-right:5px;width:6px;height:6px;transform:rotate(45deg);background:currentColor;box-shadow:0 0 5px currentColor}
.qbar .net-pill{color:var(--muted);border-color:#3e4960;background:linear-gradient(180deg,#232b3c,#181e2b)}
.qbar .net-pill.is-on{color:var(--gold);border-color:var(--gold-deep);background:linear-gradient(180deg,rgba(226,181,82,.16),rgba(226,181,82,.05));box-shadow:inset 0 1px 0 rgba(255,231,166,.1),0 0 8px rgba(226,181,82,.2)}
.qbar .net-pill i{width:6px;height:6px}
.qbar .net-continue{cursor:pointer;color:var(--gold);border-color:var(--gold-deep);background:linear-gradient(180deg,#2c2615,#1a160b)}
.qbar .net-continue[hidden],.qbar .net-pill[hidden]{display:none}
/* objectives: medallions that share the row (never a scrollbar), labels cut to two lines, full name on hover */
.qbar .goals{flex:1 1 0;min-width:0;display:flex;gap:6px;align-items:stretch;justify-content:center}
.qbar .goals > small{align-self:center}
.qbar .goal{flex:1 1 auto;min-width:0;max-width:184px;position:relative;display:flex;align-items:center;gap:6px;padding:5px 7px 5px 5px;border-radius:10px;cursor:default;
  background:linear-gradient(180deg,#222b3d,#151b28);border:1px solid #39445b;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -2px 0 rgba(0,0,0,.35),0 2px 0 #07090e}
.qbar .goal .chest{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#36425c,#121826 75%);border:1.5px solid #4a5670;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.qbar .goal .chest svg{overflow:visible}
.qbar .goal .glow{fill:#ffe7a6;opacity:0;filter:blur(2px)}
.qbar .goal .lid{transform-box:fill-box;transform-origin:0% 100%}
.qbar .goal .gtext{min-width:0;display:flex;flex-direction:column;gap:4px}
.qbar .goal b{font:700 12px/1.05 var(--display);letter-spacing:.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:normal;overflow-wrap:normal;hyphens:none}
/* a goal's name breaks only between words; one word too long for the line is cut with an ellipsis */
.qbar .goal b .w{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}
/* Wide enough that a one-word goal (Launch) shows whole rather than as an ellipsis. */
@media (min-width:1400px){.qbar .goal{min-width:104px}.qbar .goal.launch{flex:0 0 auto}}
/* Narrower desktops: each goal is its chest and step pips, its name on hover (title), so nothing clips or overlaps. */
@media (min-width:1001px) and (max-width:1399px){.qbar .goals{gap:4px}.qbar .goal{flex:0 0 auto;gap:4px;padding:4px 6px 4px 4px}.qbar .goal .chest{width:28px;height:28px}.qbar .goal b{display:none}}
.qbar .goal small{font:700 11px/1 var(--display);letter-spacing:.06em;color:var(--muted)}
.qbar .pips{display:flex;gap:3px;flex-wrap:wrap}
.qbar .pips i{width:8px;height:8px;border-radius:50%;background:#0a0e16;border:1px solid #4d5872;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.qbar .pips i.on{border-color:#f3cf73;background:radial-gradient(circle at 35% 35%,#fff1c4,var(--gold) 55%,var(--gold-deep));box-shadow:0 0 5px rgba(226,181,82,.6)}
.qbar .goal.done{border-color:var(--gold-deep);background:linear-gradient(180deg,#2e2a1d,#191812);box-shadow:inset 0 1px 0 rgba(255,231,166,.14),0 2px 0 #07090e,0 0 10px rgba(226,181,82,.18)}
.qbar .goal.done .chest{border-color:var(--gold);background:radial-gradient(circle at 50% 40%,#5a4618,#171208 75%);box-shadow:0 0 10px rgba(226,181,82,.55),inset 0 0 6px rgba(255,231,166,.35)}
.qbar .goal.done .glow{opacity:.9}
.qbar .goal.done .lid{transform:translate(-1px,-3px) rotate(-24deg)}
.qbar .goal.done .pips i.on{border-color:#b9f0cf;background:radial-gradient(circle at 35% 35%,#e3ffef,var(--ok) 60%,#2f7a51);box-shadow:0 0 5px rgba(104,197,143,.6)}
.qbar .goal.launch{border-color:#6d5320}
.qbar .goal .crown{position:absolute;left:13px;top:-8px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.7))}
.qbar .goal.gain{animation:hudgain .9s cubic-bezier(.3,1.6,.5,1) var(--gain-delay,0ms) both}
.qbar .goal.gain::after{content:"";position:absolute;inset:-1px;border-radius:10px;pointer-events:none;background:radial-gradient(ellipse at 22% 50%,rgba(255,231,166,.55),rgba(226,181,82,0) 70%);box-shadow:0 0 0 1.5px var(--gold),0 0 16px rgba(226,181,82,.6);animation:hudflash .9s ease-out var(--gain-delay,0ms) both}
.qbar .goal.gain.done .lid{animation:hudlid .9s cubic-bezier(.3,1.6,.5,1) var(--gain-delay,0ms) both}
@keyframes hudgain{0%{transform:none}25%{transform:translateY(-5px) scale(1.05)}55%{transform:translateY(1px)}75%{transform:translateY(-1px)}100%{transform:none}}
@keyframes hudflash{0%{opacity:1}100%{opacity:0}}
@keyframes hudlid{0%{transform:none}60%{transform:translate(-1px,-5px) rotate(-34deg)}100%{transform:translate(-1px,-3px) rotate(-24deg)}}
/* round and stamina, stacked at the right */
.rs-players{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.rs-players li{display:flex;align-items:center;gap:8px;font:700 14px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.rs-players li span{margin-left:auto;font:500 12px/1 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.msg .who2 .lvl,.hover-tag .lvl,.card.member b .lvl{margin-right:5px}
.hover-tag .lvl{font-size:13px}
.me-chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 8px;border-radius:999px;border:1px solid #3e4960;background:linear-gradient(180deg,#232b3c,#181e2b);color:var(--ink);font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.me-chip:empty{display:none}
.hud-status{flex:0 0 auto;width:226px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.round-strip{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.round-strip[hidden]{display:none}
.rs-round{flex:none;font:italic 700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:#1b1406;padding:4px 11px 3px;
  background:linear-gradient(180deg,#fff0b8,#f0c869 40%,var(--gold) 60%,#b88426);clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.rs-phase{--tag:#8592ab;min-width:0;overflow:hidden;text-overflow:ellipsis;font:700 10.5px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--tag);padding:3px 6px;border-radius:4px;
  background:color-mix(in srgb,var(--tag) 16%,transparent);border:1px solid color-mix(in srgb,var(--tag) 55%,transparent)}
.rs-phase[data-phase="turn"]{--tag:var(--blue-glow)}
.rs-phase[data-phase="roulette"],.rs-phase[data-phase="game"]{--tag:var(--gold)}
.rs-phase[data-phase="podium"]{--tag:#c58bff}
.rs-phase[data-phase="over"]{--tag:var(--ok)}
.rs-time{flex:none;display:inline-flex;align-items:center;gap:4px;font:700 14px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink);min-width:44px}
.rs-time::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--gold);
  background:linear-gradient(var(--gold),var(--gold)) 50% 1.5px/1.5px 4px no-repeat;animation:hudtick 4s steps(4) infinite}
@keyframes hudtick{to{transform:rotate(360deg)}}
.rs-time[hidden],.rs-pips[hidden],.rs-pip[hidden]{display:none}
.rs-pips{flex:none;display:flex;gap:4px}
/* Start a mini-game stands before Done in the dock, so Done appearing with the turn never moves it
   from under the pointer. Done pips are dots alone (Brandon, then Fernando; their names in the tooltip). */
.rs-pip{display:inline-flex;cursor:default}
.rs-pip i{width:12px;height:12px;border-radius:50%;border:1.5px solid #5b6578;background:#0b0f17;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.rs-pip.on i{border-color:#fff1c4;background:radial-gradient(circle at 35% 35%,#ffe7a6,var(--gold) 55%,var(--gold-deep));box-shadow:0 0 9px rgba(226,181,82,.8)}
.stamina{--st:var(--blue-glow);--st-hi:#a9cbff;display:flex;align-items:center;gap:6px;min-width:0}
.stamina[data-level="mid"]{--st:var(--ask);--st-hi:#ffd29a}
.stamina[data-level="low"]{--st:var(--warn);--st-hi:#ffa592}
.stamina[data-level="none"]{--st:#5b6578;--st-hi:#5b6578}
.st-ico{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--st);background:#0b0f17;border:1px solid #39445b;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--st) 45%,transparent))}
.st-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.st-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 10px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.st-top em{font-style:normal;letter-spacing:.04em;font-size:11.5px;color:var(--st);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-bar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:11px;padding:2px;background:#060910;border:1px solid #2f3a50;border-radius:4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.st-bar i{border-radius:1.5px;background:#171e2c}
.st-bar i.on{background:linear-gradient(180deg,var(--st-hi),var(--st) 60%,color-mix(in srgb,var(--st) 70%,#000));box-shadow:0 0 4px color-mix(in srgb,var(--st) 55%,transparent)}
@media (prefers-reduced-motion:reduce){.qbar .goal.gain,.qbar .goal.gain::after,.qbar .goal.gain.done .lid,.rs-time::before{animation:none}.qbar .goal.gain::after{display:none}.qbar .back::after,.hud-btn::after,.qbar .dfb-btn::after{transition:none}}
/* below 1181 px: the objectives take their own row */
@media (max-width:1180px){
  .qbar{flex-wrap:wrap}
  .hud-status{margin-left:auto}
  .qbar .goals{order:10;flex:1 1 100%}
}
/* phones: banner and buttons on the first row, the objectives as icons with pips, then round and stamina */
@media (max-width:640px){
  .qbar{padding:12px 10px 8px;gap:8px}
  .qbar .back{width:38px;height:42px}
  .qbar .back span{display:none}
  .qbar .qtitle{padding:8px 10px 5px}
  .qbar .qtitle h1{font-size:19px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .hud-sys{grid-template-rows:repeat(2,28px);grid-auto-columns:28px;gap:4px}
  .hud-btn,.qbar .dfb-btn{width:28px;height:28px}
  .qbar .goals{gap:4px}
  .hud-status{margin-left:0}
  .qbar .qtitle{flex:1 1 0}
  .qbar .goal{flex:1 1 0;flex-direction:column;justify-content:center;gap:4px;padding:5px 3px 4px;text-align:center}
  .qbar .goal .chest{width:30px;height:30px}
  .qbar .goal .gtext{align-items:center;gap:3px;width:100%}
  .qbar .goal b{font-size:10.5px;-webkit-line-clamp:1;display:block;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
  .qbar .goal b .w{display:inline;max-width:none}
  .qbar .goal .crown{left:50%;margin-left:-22px}
  .qbar .pips{justify-content:center;gap:2px}
  .qbar .pips i{width:6px;height:6px}
  .hud-status{order:11;flex:1 1 100%;width:auto;flex-direction:row;align-items:center;gap:10px}
  .round-strip{flex:0 1 auto}
  .stamina{flex:1 1 0}
}
.toggle{display:flex;align-items:center;background:rgba(11,14,21,.85);border:1px solid var(--edge);border-radius:8px;padding:2px}
.toggle button{all:unset;cursor:pointer;font:700 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 9px;border-radius:6px}
.toggle button[aria-pressed="true"]{background:var(--stone-2);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-deep)}

/* board */
.board{position:relative;min-height:560px;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#141c2c,#0b0e15 70%)}
.view{position:absolute;inset:0}
.view[hidden]{display:none!important}
.view svg.map{width:100%;height:100%;display:block}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:rgba(11,14,21,.8);border:1px solid var(--edge);border-radius:8px;padding:6px 10px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* plan view */
.plan{display:flex;flex-direction:column;height:100%;padding:16px 18px;gap:12px}
.plan-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.plan-top .k{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font:600 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--edge);border-radius:999px;padding:7px 11px;color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--night);background:var(--ink);border-color:var(--ink)}
.plan-body{position:relative;flex:1;min-height:420px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:48px 56px;padding:4px 24px;align-items:start}
.plan-body svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.gcol{position:relative;border:1.5px solid var(--gold-deep);border-radius:14px;background:rgba(20,26,38,.75);padding:12px;display:flex;flex-direction:column;gap:16px;z-index:1}
.ghead{display:flex;gap:10px;align-items:center}
.ghead b{font:italic 700 20px/1.05 var(--display)}
.ghead small{display:block;color:var(--muted);font-size:12px}
.step{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--edge);border-radius:10px;padding:9px 11px;background:var(--stone);transition:opacity .2s}
.step .n{font:700 18px/1 var(--display);color:var(--muted);width:18px;text-align:center}
.step b{display:block;font:700 15px/1.15 var(--display);letter-spacing:.01em}
.step small{display:block;color:var(--muted);font-size:12px}
.who{font:700 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:var(--stone-2)}
.step.cleared{border-color:rgba(104,197,143,.6)}
.step.cleared .n{color:var(--ok)}
.step.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(226,181,82,.25);animation:pulse 2.2s ease-in-out infinite}
.step.asking{border-color:var(--ask);box-shadow:0 0 0 1px var(--ask),0 0 22px rgba(240,162,75,.25);animation:pulse 2.2s ease-in-out infinite}
.step.fog{border-style:dashed;opacity:.45}
.step.sel{outline:2px solid var(--blue-glow);outline-offset:2px}
.step.dim{opacity:.15}
.tag{font:600 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.monster{color:var(--warn)} .tag.door{color:var(--ask)} .tag.loot{color:var(--ok)}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--gold),0 0 34px rgba(226,181,82,.45)}}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.detail{border:1px solid var(--edge);border-radius:12px;background:var(--stone);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13.5px}
.detail h3{grid-column:1/-1;margin:0 0 4px;font:700 18px/1.1 var(--display)}
.detail dt{color:var(--muted)}
.detail dd{margin:0}

/* chat */
.chat{grid-row:2/4;grid-column:2;background:#0f141e;border-left:1px solid var(--edge);display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--edge)}
.who-row{display:flex;align-items:center;gap:5px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:thin;padding:3px 2px}
.who-all{all:unset;cursor:pointer;flex:none;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--edge);font:700 11px/28px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.who-all[aria-pressed="true"]{color:var(--night);background:var(--ink);border-color:var(--ink)}
.who-face{all:unset;cursor:pointer;flex:none;width:28px;height:28px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#1b2333;border:2px solid var(--edge);font:700 10px/1 var(--display);opacity:.6;transition:opacity .15s,border-color .15s,transform .15s}
.who-face img{width:100%;height:100%;object-fit:cover}
.who-face.is-player{border-color:rgba(226,181,82,.55)}
.who-face:hover,.who-face:focus-visible{opacity:1;transform:translateY(-1px)}
.who-face[aria-pressed="true"]{opacity:1;border-color:var(--gold);box-shadow:0 0 0 2px rgba(226,181,82,.35)}
.who-label{flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:grid;grid-template-columns:30px 1fr;gap:9px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--display);border:2px solid var(--edge);background:var(--stone-2)}
.av.face{overflow:hidden;padding:0;background:#1b2333;border:2.5px solid #e2b552;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.av.face img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.msg .who2{font:700 13.5px/1 var(--display);letter-spacing:.03em}
.msg .who2 .player-tag{margin-left:7px;padding:2px 5px;border-radius:4px;border:1px solid var(--edge);font:700 9.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);vertical-align:1px}
.msg .who2 small{font:500 11px/1 var(--body);color:var(--muted);margin-left:6px}
.msg p{margin:3px 0 0;font-size:13.5px}
.tool{margin-top:5px;font-size:12px;color:var(--muted);border:1px solid var(--edge);border-radius:6px;padding:4px 8px;display:flex;justify-content:space-between}
.doorcard{border:1.5px solid var(--ask);border-radius:10px;padding:10px;background:rgba(240,162,75,.07)}
.doorcard b{font:700 15px/1.1 var(--display);color:var(--ask)}
.doorcard code{display:block;margin-top:6px;font:12px/1.4 ui-monospace,Menlo,monospace;background:#0b0f17;border:1px solid var(--edge);border-radius:6px;padding:6px 8px}
.input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--edge)}
.input input{flex:1;background:var(--night);border:1px solid var(--edge);border-radius:8px;color:var(--ink);padding:10px;font:14px var(--body)}
.input button{all:unset;cursor:pointer;font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;border-radius:8px;background:var(--stone-2);border:1px solid var(--edge)}

/* cards */
.dock{grid-column:1;min-width:0}
.hand[hidden]{display:none}
.dock-tabs{display:flex;gap:6px;padding:10px 18px 0}
.dock-tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:7px 14px 6px;border:1px solid var(--edge);border-bottom:0;border-radius:10px 10px 0 0;background:#0f141e;color:var(--muted);font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.dock-tab[aria-pressed="true"]{color:var(--gold)}
.dock-tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dock-tab .chev{transition:transform .25s}
.card.member{flex:0 0 190px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr;column-gap:10px;row-gap:4px;align-content:start}
.card.member .av{grid-row:1/3;width:36px;height:36px;font-size:13px}
.card.member b{align-self:end;text-transform:none}
.member .kind{font:700 9.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card.member small{grid-column:1/-1}
.card.member[aria-pressed="true"]{border-color:var(--gold-deep)}
/* A member's figure stands at the card's left on a glow of their colour, head above the card's top.
   Each figure's feet sit in the middle of its image, 8% up: the glow is centred there (x 52px). */
/* Figures rise out of the panel: it clips sideways only, with room above the cards for the heads. */
.hand.party-bar{padding-top:46px;overflow-x:clip;overflow-y:visible}
.card.member.has-figure{flex-basis:118px;height:96px;padding-left:108px;grid-template-columns:1fr;background:linear-gradient(90deg,color-mix(in srgb,var(--member) 16%,#1b2333),#131a27 62%)}
.card.member.has-figure::before{content:"";position:absolute;left:14px;bottom:5px;width:76px;height:18px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--member) 60%,transparent),transparent)}
.member-edit{position:absolute;top:8px;right:8px;z-index:3;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;border:1px solid var(--gold-deep);background:rgba(11,14,21,.78);color:var(--gold);font:700 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity .15s,background .15s}
.card.member:hover .member-edit,.card.member:focus-within .member-edit,.member-edit:focus-visible{opacity:1}
.member-edit:hover{background:rgba(226,181,82,.18)}
@media (hover:none){.member-edit{opacity:1}}
.card.member .figure{position:absolute;left:-36px;bottom:0;width:176px;height:176px;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55));transform-origin:50% 90%;transition:transform .2s}
.card.member:hover .figure{transform:translateY(-4px) scale(1.04)}
.card.member.has-figure>b,.card.member.has-figure>.kind,.card.member.has-figure>small{position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.8)}
@media (prefers-reduced-motion:reduce){.card.member .figure{transition:none}}
.hand{display:flex;gap:12px;padding:10px 18px 12px;border-top:1px solid var(--edge);background:linear-gradient(#0f141e,#0b0e15);overflow-x:auto}
.card{all:unset;cursor:pointer;flex:0 0 118px;height:120px;border-radius:12px;border:1.5px solid var(--edge);background:linear-gradient(#1b2333,#131a27);padding:10px;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .15s}
.card:hover{transform:translateY(-6px)}
.card svg{width:28px;height:28px}
.card b{font:700 16px/1.05 var(--display);letter-spacing:.03em;text-transform:uppercase}
.card small{color:var(--muted);font-size:11.5px;line-height:1.3}
.card.lit{border-color:var(--ask);box-shadow:0 0 0 1px var(--ask),0 0 22px rgba(240,162,75,.3)}
.card.lit.allow{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 0 22px rgba(104,197,143,.3)}
.card .cost{position:absolute;top:8px;right:8px;font:600 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{position:fixed;right:352px;bottom:180px;max-width:280px;background:#232c3f;border:1px solid var(--edge);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);z-index:5}
.note b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.step.current,.step.asking,.flow{animation:none}}
@media (max-width:1000px){
  .screen{grid-template-columns:minmax(0,1fr)}
  .chat{grid-row:auto;grid-column:1;min-height:420px;border-left:0;border-top:1px solid var(--edge)}
  .note{display:none}
  .plan-body{grid-template-columns:1fr;gap:20px}
  .plan-body svg.wires{display:none}
}

/* demo: label, panels, done states */
.gcol.done{border-color:rgba(104,197,143,.6)}
.muted{color:var(--muted)}
.plan{overflow-y:auto}
.plan-body{flex:1 0 auto}
.doorcard small{display:block;margin-top:6px;font-size:12px}
.msg.mine .av{font-size:10px;color:var(--muted)}
.offer{margin:0 12px;border:1.5px solid var(--gold-deep);border-radius:10px;padding:10px;background:rgba(226,181,82,.07);font-size:13px}
.offer[hidden]{display:none}
.offer b{font:700 15px/1.1 var(--display);color:var(--gold)}
.offer p{margin:6px 0 8px}
.offer-actions{display:flex;gap:8px}
.offer-actions button,.outcome button{all:unset;cursor:pointer;font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:8px;background:var(--stone-2);border:1px solid var(--edge)}
.offer-actions button:first-child,.outcome button{border-color:var(--gold-deep);color:var(--gold)}
.offer-actions button:hover,.outcome button:hover{background:#243049}
.outcome{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;min-width:300px;max-width:420px;background:rgba(15,20,30,.97);border:1.5px solid var(--gold);border-radius:14px;padding:18px 20px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.outcome[hidden]{display:none}
.outcome b{font:italic 700 26px/1.05 var(--display);color:var(--gold)}
.outcome p{margin:8px 0}
.outcome ul{margin:4px 0 10px;padding-left:18px}
.outcome-actions{display:flex;align-items:center;gap:14px}
.outcome-link{font:700 13px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.outcome-link:hover{color:var(--gold)}
.card[aria-disabled="true"]{cursor:default;opacity:.5}
.card[aria-disabled="true"]:hover{transform:none}

/* the live board and its toolbar */
#level{position:absolute;inset:0}
/* Top right of the board; the conversation column starts below it. */
.toolbar{position:absolute;right:14px;top:14px;display:flex;align-items:center;gap:6px;z-index:8}
.tb-3d{display:flex;gap:6px}
.toolbar:has(#t-plan[aria-pressed="true"]) .tb-3d{display:none}
.tb-slot{position:relative}
.preview-flyout{position:fixed;z-index:30;padding:6px;border-radius:12px;background:rgba(15,20,30,.97);border:1px solid var(--gold-deep);box-shadow:0 12px 30px rgba(0,0,0,.6);pointer-events:none}
.preview-flyout canvas,.preview-flyout video{display:block;border-radius:8px}
.preview-flyout video{width:280px;height:180px;object-fit:cover;background:#0b0e15}
.preview-flyout[hidden]{display:none}
.tb-val{font:600 11px/1 var(--body);letter-spacing:.02em;text-transform:none;color:var(--ink);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tb-val:empty{display:none}
/* The chosen value shows only while the button is hovered, focused or open. */
.tbtn .tb-val{display:none}
.tbtn:hover .tb-val:not(:empty),.tbtn:focus-visible .tb-val:not(:empty),.tbtn[aria-expanded="true"] .tb-val:not(:empty){display:inline}
.tbtn .chev{opacity:.75;margin-left:-1px}
.tbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
#rotation-pop{width:220px}
#zoom-pop{width:260px}
.zoom-slider{display:grid;grid-template-columns:28px 1fr 28px auto;align-items:center;gap:8px}
.zoom-slider button{height:28px;border-radius:7px;border:1px solid var(--edge);background:rgba(20,26,38,.92);color:var(--ink);font:700 15px/1 var(--body);cursor:pointer}
.zoom-slider button:hover{color:var(--gold)}
.zoom-slider input{accent-color:var(--gold)}
.zoom-slider output{font:600 12px/1 var(--body);color:var(--muted);min-width:34px;text-align:right}
.pop .presets.list{grid-template-columns:1fr;gap:2px}
.pop .presets.list button{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 8px;font-size:13px}
.tbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:4px 6px;box-sizing:border-box;height:26px;border-radius:9px;background:rgba(20,26,38,.92);border:0;color:var(--ink);font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.tbtn:hover,.tbtn[aria-expanded="true"]{color:var(--gold);background:rgba(30,38,54,.96)}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:320px;max-height:calc(100vh - 220px);overflow-y:auto;font:13px/1.4 var(--body);background:rgba(15,20,30,.97);border:1px solid var(--edge);border-radius:12px;padding:12px;display:grid;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.pop[hidden]{display:none}
.pop-k{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.pop > div{display:grid;gap:10px}
/* The level's Out button (inline-styled by out-button.ts), dressed like the toolbar beside it. */
#level button[aria-label="Step out"]{all:unset !important;position:absolute !important;left:14px !important;top:14px !important;z-index:8 !important;cursor:pointer !important;display:inline-flex !important;align-items:center !important;gap:6px !important;padding:8px 12px !important;border-radius:9px !important;background:rgba(20,26,38,.92) !important;border:0 !important;color:var(--ink) !important;font:700 13px/1 var(--display) !important;letter-spacing:.06em !important;text-transform:uppercase !important;box-sizing:border-box !important;height:38px !important}
#level button[aria-label="Step out"]:hover{color:var(--gold) !important;background:rgba(30,38,54,.96) !important}
#level button[aria-label="Step out"]:focus-visible{outline:2px solid var(--gold) !important;outline-offset:2px !important}
#level button[aria-label="Step out"][hidden]{display:none !important}
/* The controls legend: plain grey text, bottom right of the board. */
.keys{position:absolute;right:16px;bottom:10px;z-index:8;margin:0;font:12px/1.3 var(--body);color:#8a93a4;text-align:right;max-width:60%;pointer-events:none}
/* The unlocked rooms, top left of the board, in place of the level's Out button. */
.rooms{position:absolute;left:14px;top:14px;z-index:8;display:grid;gap:4px;min-width:170px}
.rooms button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:9px;background:rgba(20,26,38,.92);color:var(--ink);font:700 13px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.rooms button:hover{color:var(--gold);background:rgba(30,38,54,.96)}
.rooms button[aria-current="true"]{color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.rooms button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* The selected room opens into its checklist (src/data/room-checklist.ts): compact, under its button;
   the list scrolls inside its box when it runs long. */
.rooms{max-height:calc(100% - 96px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--gold-deep) transparent;width:min(300px,calc(100% - 28px))}
.rooms:not(.expanded){width:auto}
.rooms button[aria-expanded="true"]{border-radius:9px 9px 0 0}
.room-check{margin-top:-4px;padding:6px 10px 8px 12px;border-radius:0 0 9px 9px;background:rgba(14,19,28,.94);box-shadow:inset 3px 0 0 var(--gold);font:12px/1.3 var(--body);color:var(--ink)}
.ck-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:5px;font:600 10.5px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ck-who{color:var(--ink);text-transform:none;letter-spacing:.01em;font-size:11.5px}
.ck-status{padding:2px 6px;border-radius:999px;border:1px solid currentColor}
.ck-status[data-status="fogged"]{color:#8a93a4}
.ck-status[data-status="in-progress"]{color:var(--gold)}
.ck-status[data-status="done"]{color:#9fc7ff}
.ck-status[data-status="verified"]{color:#7fd39a}
.ck-count{margin-left:auto}
.ck-list{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.ck-item{display:grid;grid-template-columns:13px 1fr;gap:7px;align-items:start;color:#c9cfdb}
.ck-item .ck-box{margin-top:1px}
.ck-item.done{color:#8f98a8}
.ck-item[data-kind="proof"] span,.ck-item[data-kind="output"] span,.ck-item[data-kind="door"] span,.ck-item[data-kind="monster"] span{color:var(--gold)}
.ck-item.done[data-kind] span{opacity:.75}
.ck-none{grid-template-columns:1fr;color:var(--muted);font-style:italic}
/* The same checklist under the selected step card in the plan. */
.plan-check{margin:-6px 0 2px;border:1.5px solid var(--edge);border-top:none;box-shadow:none;background:rgba(14,19,28,.7);position:relative;z-index:1}
#level button[aria-label="Step out"]{display:none !important}
/* The hover name tag beside the pointer. */
.hover-tag{position:fixed;left:0;top:0;z-index:40;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(15,20,30,.94);border:1px solid var(--gold-deep);color:var(--gold);font:700 14px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.hover-tag[hidden]{display:none}
.hover-tag.member:not([hidden]){display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;text-transform:none;color:var(--ink)}
.hover-tag.member .av{width:26px;height:26px;font-size:11px}
.hover-tag.member .face{width:34px;height:34px;border-radius:50%;border:2.5px solid #e2b552;background:#1b2333 center/cover no-repeat;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.hover-tag .player-tag{padding:2px 5px;border-radius:4px;border:1px solid var(--edge);font:700 9.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* The level's conversation column: the top part of the board, not its whole height. */
#level section[aria-label^="Conversation"]{top:64px !important;bottom:auto !important;max-height:58%}
.pop legend{padding:0;margin-bottom:6px;font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* The playground's control styles (experiments/tutorial-level/index.html), scoped to the popovers. */
.pop button, .pop select { font: inherit; }
.pop label { display: grid; gap: 4px; }
.pop details { border-top: 1px solid #333; padding-top: 8px; }
.pop summary { cursor: pointer; font-weight: 600; }
.pop details > div { display: grid; gap: 10px; margin-top: 10px; }
.pop label > span { display: flex; justify-content: space-between; }
.pop output { opacity: 0.75; font-variant-numeric: tabular-nums; }
.pop input[type=range] { width: 100%; }
.pop label.colour { display: flex; justify-content: space-between; align-items: center; }
.pop label.inline { display: inline-flex; gap: 4px; margin-right: 12px; }
.pop fieldset { border: 1px solid #333; border-radius: 6px; padding: 6px 8px; }
.pop fieldset.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pop fieldset.steps button { display: grid; justify-items: center; gap: 2px; padding: 4px 2px; }
.pop fieldset.steps button[aria-pressed="true"] { background: #e8c472; color: #111; }
.pop fieldset.steps button[aria-pressed="true"] svg * { stroke: #111; fill-opacity: .35; }
.pop fieldset.steps button[aria-pressed="true"] circle { fill: #111; }
.pop fieldset.compass { display: grid; justify-items: center; }
.pop .compass .slice { fill: #23262d; stroke: #111; stroke-width: 1.5; cursor: pointer; }
.pop .compass g[role=button]:hover .slice { fill: #3a3424; }
.pop .compass g[aria-pressed="true"] .slice { fill: #e8c472; }
.pop .compass g[aria-pressed="true"] text { fill: #111; }
.pop .compass g:focus-visible .slice { stroke: #e8c472; stroke-width: 2.5; }
.pop .compass .slice.side { fill: #161719; cursor: default; }
.pop .compass text { fill: #ddd; font: 600 9px system-ui, sans-serif; pointer-events: none; }
.pop .compass text.cardinal { fill: #666; font-size: 12px; font-weight: 700; }
.pop .compass text.diagonal { font-size: 11px; font-weight: 700; }
.pop .compass text.minor { font-size: 8px; }
.pop .compass text.hub { fill: #e8c472; font-size: 12px; }
.pop .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.pop .presets button { display: grid; justify-items: center; gap: 3px; padding: 6px 2px; font-size: 11px; line-height: 1.15; }

/* ---- touch screens (touch-controls.js): the stick in the board's left third, Use and Swing at the

.touch .zoom-dock,.touch .keys{display:none}
.stick-zone{position:absolute;left:0;top:60px;bottom:52px;width:33.333%;z-index:9;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.phone .stick-zone{bottom:calc(104px + env(safe-area-inset-bottom));left:env(safe-area-inset-left)}
.stick-base{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(15,20,30,.35),rgba(15,20,30,.6));border:2px solid rgba(226,181,82,.55);box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 18px rgba(0,0,0,.5)}
.stick-base[hidden]{display:none}
.stick-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff1c4,var(--gold) 55%,var(--gold-deep));box-shadow:0 4px 12px rgba(0,0,0,.55),0 0 14px rgba(226,181,82,.45)}
.touch-actions{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:62px;z-index:10;display:flex;align-items:flex-end;gap:12px;pointer-events:none}
.phone .touch-actions{bottom:calc(112px + env(safe-area-inset-bottom))}
.touch-actions button{all:unset;box-sizing:border-box;pointer-events:auto;cursor:pointer;display:grid;place-items:center;align-content:center;gap:2px;border-radius:50%;text-align:center;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.touch-actions button[hidden]{display:none}
.touch-actions .ta-use{width:68px;height:68px;color:#1a1206;border:2px solid #f6d48a;background:radial-gradient(circle at 40% 30%,#fbe3a0,var(--gold) 60%,var(--gold-deep));box-shadow:0 6px 16px rgba(0,0,0,.55),0 0 18px rgba(226,181,82,.4)}
.ta-use b{font:italic 700 20px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.ta-use small{font:700 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}
.touch-actions .ta-swing{width:96px;height:96px;color:#fff;border:2px solid #ffc5b6;background:radial-gradient(circle at 40% 30%,#ff9a82,var(--warn) 58%,#8f2d1d);box-shadow:0 8px 20px rgba(0,0,0,.6),0 0 22px rgba(229,103,79,.45)}
.ta-swing b{font:italic 700 19px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.ta-use:active,.ta-swing:active{transform:scale(.94)}
.ta-use:focus-visible,.ta-swing:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.board.in-arena .stick-zone{top:120px}

/* The loading line's progress (loading.js): files done of asked, and the megabytes so far. */
.board-loading.has-progress{display:flex;flex-direction:column;align-items:center;gap:10px;animation:none;text-align:center}
.board-loading.has-progress[hidden]{display:none}
.bl-label{animation:board-loading 1.6s ease-in-out infinite}
.bl-bar{display:block;width:min(240px,60vw);height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.bl-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transform:scaleX(0);transform-origin:0 50%;transition:transform .3s ease}
.stream-pip{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:6px;padding:4px 9px 4px 6px;border-radius:999px;background:rgba(15,20,30,.55);border:1px solid rgba(255,255,255,.06);font:600 11px/1 var(--body);letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none;opacity:.8;transition:opacity .4s}
.stream-pip[hidden]{display:none}
.stream-pip.done{opacity:0}
.stream-pip svg{transform:rotate(-90deg)}
.stream-pip circle{fill:none;stroke-width:3}
.stream-pip .sp-track{stroke:rgba(255,255,255,.1)}
.stream-pip .sp-fill{stroke:var(--gold);stroke-dasharray:100;stroke-dashoffset:100;stroke-linecap:round;transition:stroke-dashoffset .3s ease}
.board.in-arena .stream-pip{display:none}
@media (prefers-reduced-motion:reduce){.stream-pip,.stream-pip .sp-fill{transition:none}}
.bl-count{font:600 11.5px/1 var(--body);letter-spacing:.06em;text-transform:none;color:var(--muted);min-height:1em;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.bl-label{animation:none}.bl-bar i{transition:none}}
/* No WebGPU: what the board would show, said plainly. */
.no-gpu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;width:min(460px,calc(100% - 32px));padding:18px 20px;border-radius:14px;
  background:rgba(15,20,30,.97);border:1.5px solid var(--gold-deep);box-shadow:0 14px 34px rgba(0,0,0,.6);text-align:left}
.no-gpu .k{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.no-gpu h2{margin:6px 0 8px;font:italic 700 24px/1.05 var(--display)}
.no-gpu p{margin:0 0 8px;font-size:14px;line-height:1.45}
.no-webgpu :is(.stick-zone,.touch-actions,#zoom-controls,.keys,#start-game-btn){display:none !important}

<body>


<div class="screen">
  <!-- The quest bar as a game HUD: the banner (title, badges), the objective medallions, the round and
       stamina, and the small system buttons. Class hooks for the phone layout: .hud-banner, .hud-badges,
       .goals, .hud-status, .hud-sys. -->
  <header class="qbar">
    <button class="back" id="back" aria-label="Back to the realm (retreats in the demo)" data-tip="Back to the realm"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 4 12l7 7"/><path d="M5 12h15"/></svg><span>Realm</span></button>
    <div class="qtitle hud-banner"><div class="k" title="Planned with the Quartermaster">Quest</div><h1 id="quest-title">Launch a production-ready landing page</h1>
      <div class="demo-row hud-badges"><span class="demo-tag" id="demo-tag">Demo quest: simulated party</span><span id="net-pill" hidden></span></div></div>
    <div class="goals" id="goals"></div>
    <div class="hud-status">
      <div class="round-strip" id="round-strip" role="status" aria-label="Round" hidden></div>
      <div class="stamina" id="stamina"></div>
    </div>
    <div class="me-chip" id="me-chip" aria-label="You"></div>
    <div class="hud-sys" role="group" aria-label="Demo">
      <button type="button" class="demo-restart hud-btn" id="restart" data-tip="Restart demo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4v5h5"/></svg><span class="sr">Restart demo</span></button>
      <a class="demo-restart hud-btn" id="start-over" href="#" data-tip="Start over"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"/><path d="M18 6l-8 6 8 6z" fill="currentColor"/></svg><span class="sr">Start over</span></a>
    </div>
  </header>

  <main class="board">
      <div class="toolbar" role="toolbar" aria-label="View">
        <div class="toggle" role="group" aria-label="Dungeon or plan">
          <button id="t-dungeon" aria-pressed="true">Dungeon</button>
          <button id="t-plan" aria-pressed="false">Plan</button>
        </div>
        <div class="tb-3d">
                <div class="tb-slot">
          <button class="tbtn" id="open-rotation" aria-haspopup="true" aria-expanded="false" title="Rotation" aria-label="Rotation"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 5.5 14.2 12 12 18.5 9.8 12z"/><path d="M12 5.5 14.2 12H9.8z" fill="currentColor"/></svg><span class="tb-val" id="val-rotation"></span><svg class="chev" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>
          <div class="pop" id="rotation-pop" hidden>
            <div id="rotation-controls"></div>
          </div>
        </div>
                        <div class="tb-slot">
          <button class="tbtn" id="open-characters" aria-haspopup="true" aria-expanded="false" title="Characters" aria-label="Characters"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 6.5C12 3.6 15 1.8 20.5 2.6 17.6 3.4 15.6 4.8 14.6 7"/><path d="M5.5 21.5V13a6.5 6.5 0 0 1 13 0v8.5"/><path d="M5.5 21.5h13"/><path d="M7 12.3h10" stroke-width="2.4"/><path d="M12 13.5v6"/><path d="M9 16.5v.01M9 18.8v.01M15 16.5v.01M15 18.8v.01" stroke-width="2"/></svg><span class="tb-val" id="val-characters"></span><svg class="chev" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>
          <div class="pop" id="characters-pop" hidden>
            <div id="character-controls"></div>
            <button type="button" id="copy-settings" class="tbtn">Copy settings</button>
            <p id="copied" role="status" aria-live="polite"></p>
          </div>
        </div>
        </div>
      </div>
    <!-- DUNGEON VIEW: the live tutorial level -->
    <section class="view" id="v-dungeon" aria-label="Dungeon">
      <div id="level"></div>
      <nav class="rooms" id="rooms" aria-label="Rooms"></nav>
      <div class="board-loading" id="board-loading" role="status">Entering the Dungen</div>
      <div class="stream-pip" id="stream-pip" role="status" hidden><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><circle cx="10" cy="10" r="8" class="sp-track"/><circle cx="10" cy="10" r="8" class="sp-fill" pathLength="100"/></svg><span class="sp-text"></span></div>
      <div class="zoom-dock" id="zoom-controls" aria-label="Zoom"></div>
      <p class="keys" aria-label="Controls">Wheel zoom · Left-drag rotate · Right-drag pan · Click go</p>
    </section>

    <!-- PLAN VIEW -->
    <div class="outcome" id="outcome" role="dialog" aria-label="Quest result" hidden></div>
    <div class="round-show" id="round-show" hidden></div>
    <section class="view" id="v-plan" aria-label="Plan" hidden>
      <div class="plan">
        <div class="plan-top">
          <span class="k">Show</span>
          <div class="chips" role="group" aria-label="Party filter" id="plan-chips"></div>
        </div>
        <div class="plan-body" id="planBody">
          <svg class="wires" id="wires" aria-hidden="true"></svg>
        </div>
        <dl class="detail" id="detail"></dl>
      </div>
    </section>
  </main>

  <aside class="chat" aria-label="Party chat">
    <div class="chat-head" id="chat-chips" role="group" aria-label="Show messages from"></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="offer" id="offer" hidden></div>
    <div class="input"><input id="say" placeholder="Message the party" aria-label="Message the party"><button type="button" id="send">Send</button></div>
  </aside>

  <div class="dock" id="dock">
  <div class="dock-tabs" role="group" aria-label="Bottom panel"><button type="button" class="dock-tab" data-panel="hand" aria-pressed="true"><svg class="chev" viewBox="0 0 12 8" width="12" height="8" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M1 7l5-5 5 5"/></svg>Actions</button><button type="button" class="dock-tab" data-panel="party" aria-pressed="false"><svg class="chev" viewBox="0 0 12 8" width="12" height="8" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M1 7l5-5 5 5"/></svg>Party</button><button type="button" class="dock-tab icon" data-panel="camera" aria-pressed="false" aria-label="Camera" title="Camera"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="6.5" r="2.6"/><circle cx="13" cy="6.5" r="2.6"/><rect x="3" y="10" width="13" height="8" rx="1.5"/><path d="M16 12.5 21 10v8l-5-2.5"/><circle cx="7" cy="14" r="1" fill="currentColor"/></svg></button><button type="button" class="dock-tab icon" data-panel="mood" aria-pressed="false" aria-label="Mood" title="Mood"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a7 7 0 0 0 0 14z" fill="currentColor"/><path d="M12 5a7 7 0 0 1 0 14"/><path d="M12 1.5v2M12 20.5v2M4.6 4.6 6 6M18 18l1.4 1.4M1.5 12h2M20.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button><button type="button" class="dock-done dock-start" id="start-game-btn" hidden>Start a mini-game</button><button type="button" class="dock-done" id="done-btn" aria-pressed="false" hidden>Done</button></div>
  <nav class="hand" data-panel="hand" aria-label="Your cards">
    <button type="button" class="card allow" id="c-allow"><svg viewBox="0 0 24 24" fill="none" stroke="#68c58f" stroke-width="2"><path d="M5 12l5 5 9-10"/></svg><b>Allow</b><small>No door is waiting</small></button>
    <button type="button" class="card" id="c-deny"><svg viewBox="0 0 24 24" fill="none" stroke="#f0a24b" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg><b>Deny</b><small>No door is waiting</small></button>
    <button type="button" class="card" id="c-hint"><svg viewBox="0 0 24 24" fill="none" stroke="#e2b552" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11v2h6v-2a6 6 0 0 0-3-11z"/></svg><b>Hint</b><small>Whisper advice to one character</small></button>
    <button type="button" class="card" id="c-change"><svg viewBox="0 0 24 24" fill="none" stroke="#e2b552" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M15 9l-4 2-2 4 4-2z" fill="#e2b552"/></svg><b>Change direction</b><small>Back to the Quartermaster to replan</small></button>
    <button type="button" class="card" id="c-summon"><svg viewBox="0 0 24 24" fill="none" stroke="#5ea0ff" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6M19 4v4M17 6h4"/></svg><b>Summon</b><small>Bring another agent into the party</small></button>
    <button type="button" class="card" id="c-pause"><svg viewBox="0 0 24 24" fill="none" stroke="#9aa3b5" stroke-width="2"><path d="M9 6v12M15 6v12"/></svg><b>Pause</b><small>Freeze the party in place</small></button>
    <button type="button" class="card" id="c-retreat"><svg viewBox="0 0 24 24" fill="none" stroke="#e5674f" stroke-width="1.8"><path d="M14 6l-6 6 6 6M8 12h12"/></svg><b>Retreat</b><small>Stop and return to the realm. Loot is kept</small></button>
  </nav>
  <nav class="hand party-bar" id="party-bar" data-panel="party" aria-label="Your party" hidden></nav>
  <div class="hand view-bar" data-panel="camera" aria-label="Camera" hidden><div id="camera-controls"></div></div>
  <div class="hand view-bar" data-panel="mood" aria-label="Mood" hidden><div id="mood-controls"></div></div>
  </div>
</div>
